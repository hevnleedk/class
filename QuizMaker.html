<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀴즈 은행 스마트 복사 툴</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (v18) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX interpretation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Font (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Inline SVG Icon Components
    const IconCopy = ({ size = 16, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
    );

    const IconCheckCircle = ({ size = 18, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    );

    const IconListTodo = ({ size = 26, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="3" y="5" width="6" height="6" rx="1"></rect>
        <path d="m3 17 2 2 4-4"></path>
        <path d="M13 6h8"></path>
        <path d="M13 12h8"></path>
        <path d="M13 18h8"></path>
      </svg>
    );

    const IconSparkles = ({ size = 18, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
        <path d="M5 3v4"></path>
        <path d="M19 17v4"></path>
        <path d="M3 5h4"></path>
        <path d="M17 19h4"></path>
      </svg>
    );

    const IconTrash2 = ({ size = 15, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M3 6h18"></path>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    );

    const IconHelpCircle = ({ size = 17, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    );

    const IconArrowRight = ({ size = 13, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    );

    const IconLayers = ({ size = 14, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
    );

    const IconFileText = ({ size = 40, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <line x1="10" y1="9" x2="8" y2="9"></line>
      </svg>
    );

    // 샘플 입력 데이터
    const SAMPLE_INPUT = `Q1. [객관식] 인터넷 검색을 통해 자료를 수집할 때 가장 주의해야 할 사항은 무엇인가요?
① 정보의 양이 너무 많은 것
② 인터넷 속도가 느려지는 것
③ 가짜 정보에 속아 사회적 피해를 입거나 잘못된 결과를 얻는 것
④ 검색 사이트의 디자인이 마음에 들지 않는 것
[정답] ③
[해설] 인터넷 검색으로 자료를 수집할 때는 가짜 정보를 조심해야 합니다.

Q2. [선긋기] 다음 인터넷 검색 사이트와 그 구분을 바르게 연결하시오.
(가) 국내 검색 사이트 - (A) 구글(Google), 야후(Yahoo), 빙(MSBing)
(나) 국외 검색 사이트 - (B) 네이버(Naver), 다음(Daum), 네이트(Nate)
[정답] (가)-(B), (나)-(A)
[해설] 국내 대표 포털 사이트로는 네이버, 다음 등이 있으며 국외로는 구글 등이 있습니다.

Q3. [드래그 앤 드롭] 인터넷 검색이란 §빈칸§를 통해 자신의 목적에 맞는 자료를 찾아 종합하는 것이다. 데이터를 저장, 추가, 삭제하는 등 데이터를 효율적으로 처리하는 모든 행위를 §빈칸§라고 부른다.
[보기] (A) 검색 사이트  (B) 데이터 관리  (C) 데이터베이스  (D) 정보 압축
[정답] 빈칸1: 검색 사이트, 빈칸2: 데이터 관리
[해설] 첫 번째 빈칸은 검색 사이트, 두 번째 빈칸은 데이터 관리입니다.`;

    const CopyBlock = ({ label, text, onCopy, highlight = false, badgeColor = '' }) => {
      return (
        <div 
          className={`group relative flex flex-col p-3.5 rounded-xl border cursor-pointer transition-all duration-200 ${
            highlight 
              ? 'bg-amber-50/80 border-amber-300 hover:bg-amber-100/90 hover:border-amber-400 hover:shadow-md' 
              : 'bg-slate-50 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 hover:shadow-md'
          }`}
          onClick={() => onCopy(text, label)}
        >
          <div className="flex justify-between items-center mb-1.5">
            <span className={`text-xs font-bold tracking-wider px-2.5 py-0.5 rounded-full ${
              badgeColor ? badgeColor : highlight ? 'bg-amber-200/80 text-amber-900' : 'bg-slate-200/60 text-slate-600 group-hover:text-indigo-600'
            }`}>
              {label}
            </span>
            <div className="text-slate-400 group-hover:text-indigo-600 transition-colors">
              <IconCopy size={16} />
            </div>
          </div>
          <div className="whitespace-pre-wrap text-slate-800 text-sm leading-relaxed font-medium">
            {text}
          </div>
        </div>
      );
    };

    function App() {
      const [inputText, setInputText] = useState("");
      const [quizList, setQuizList] = useState([]);
      const [toastMessage, setToastMessage] = useState("");
      const [filter, setFilter] = useState("전체");

      const parseText = (rawText) => {
        if (!rawText.trim()) return [];

        // Q1., Q2., [문제1], 1. 등의 형태를 감지하여 개별 문항 블록으로 분할
        const blocks = rawText
          .split(/(?=(?:Q\d+[\.\:]?\s*|\[문제\d+\]|\d+\.\s*\[|\d+\.\s*Q))/i)
          .filter(b => b.trim().length > 0);
        
        const parsed = blocks.map((block) => {
          // 문제 유형 추출
          const typeMatch = block.match(/\[(객관식|주관식|선긋기|드래그 앤 드롭|드래그앤드롭|빈칸채우기|일반|단답형)\]/i);
          let type = typeMatch ? typeMatch[1] : "일반";
          
          let cleanBlock = block;
          
          // 정답 및 해설 추출
          const ansMatch = cleanBlock.match(/\[정답\]\s*([\s\S]*?)(?=\[해설\]|$)/i);
          const expMatch = cleanBlock.match(/\[해설\]\s*([\s\S]*)/i);
          
          const answer = ansMatch ? ansMatch[1].trim() : "";
          const explanation = expMatch ? expMatch[1].trim() : "";

          // [정답] 이전의 문제 + 보기 영역 추출
          const beforeAnswer = cleanBlock.split(/\[정답\]/i)[0].trim();
          
          // 헤더 제거 (Q1., Q1, 1., [객관식] 등 중복 잔여물 정제)
          let withoutHeader = beforeAnswer
            .replace(/^Q\d*[\.\:\s]*/i, '')
            .replace(/^\d+[\.\:]?\s*/, '')
            .replace(/^\[.*?\]\s*/, '')
            .replace(/^Q\d*[\.\:\s]*/i, '')
            .trim();

          // 보기/항목 구분자 시작점 찾기 (①, (가), (A), [보기] 등)
          const optStartRegex = /(①|②|③|④|⑤|\(가\)|\(나\)|\(다\)|\(라\)|\(마\)|\(A\)|\(B\)|\(C\)|\(D\)|\(E\)|\[보기\])/;
          const optMatch = withoutHeader.match(optStartRegex);
          
          let rawQuestion = withoutHeader;
          let rawOptionsString = "";
          
          if (optMatch) {
            const optIndex = optMatch.index;
            rawQuestion = withoutHeader.substring(0, optIndex).trim();
            rawOptionsString = withoutHeader.substring(optIndex).trim();
          }

          // §빈칸§ 개수 체크
          const blankMatches = rawQuestion.match(/§빈칸§/g);
          const blankCount = blankMatches ? blankMatches.length : 0;

          if (blankCount > 0 && (type === "일반" || type === "주관식")) {
            type = "드래그 앤 드롭";
          }

          // 보기/선지/연결 항목 개별 분할 parsing
          let options = [];
          if (rawOptionsString) {
            const cleanedOpts = rawOptionsString.replace(/^\[보기\]\s*/i, '');
            const parts = cleanedOpts.split(/(?=[①②③④⑤]|\([가나다라마]\)|\([A-Ea-e]\)|[A-E]\.\s*)/);
            options = parts
              .map(p => {
                let item = p.trim();
                // 끝에 위치한 대시(-) 및 공백 정리
                item = item.replace(/[\s\-\─\–\—]+$/, '').trim();
                return item;
              })
              .filter(p => p.length > 0);

            if (options.length <= 1 && cleanedOpts.includes('\n')) {
              options = cleanedOpts
                .split('\n')
                .map(s => s.replace(/[\s\-\─\–\—]+$/, '').trim())
                .filter(Boolean);
            }
          }

          // 개별 빈칸 정답 분할
          let individualBlankAnswers = [];
          if (answer) {
            const items = answer.split(/(?:,|\n|;)/).map(s => s.trim()).filter(Boolean);
            
            if (items.length > 1) {
              individualBlankAnswers = items.map((item, idx) => {
                const cleanVal = item.replace(/^(?:빈칸\s*\d+\s*[:\-=]?|\d+[\.:\-=]?)\s*/i, '');
                const labelText = item.includes(':') ? item.split(':')[0].trim() : `빈칸 ${idx + 1} 정답`;
                return {
                  label: labelText,
                  value: cleanVal || item
                };
              });
            }
          }

          return {
            type,
            question: String(rawQuestion || ''),
            blankCount,
            options: options.map(opt => String(opt)),
            answer: String(answer || ''),
            individualBlankAnswers,
            explanation: String(explanation || '')
          };
        })
        .filter(q => {
          // 내용 없는 껍데기 문제 제거
          const cleanQ = q.question.replace(/^Q\d*[\.\:\s]*/i, '').trim();
          return cleanQ.length > 0;
        });

        return parsed.map((q, idx) => ({ ...q, id: idx + 1 }));
      };

      const handleConvert = () => {
        if (!inputText.trim()) {
          showToast("변환할 텍스트를 입력하거나 '예시 불러오기'를 눌러주세요.");
          return;
        }
        const parsed = parseText(inputText);
        if (parsed.length > 0) {
          setQuizList(parsed);
          setFilter("전체");
          showToast(`${parsed.length}개 문항이 성공적으로 변환되었습니다!`);
        } else {
          showToast("문제 형식을 인식하지 못했습니다. Q1., [정답], [해설] 등을 확인해 주세요.");
        }
      };

      const handleClear = () => {
        setInputText("");
        setQuizList([]);
        showToast("입력 내용이 초기화되었습니다.");
      };

      const handleLoadSample = () => {
        setInputText(SAMPLE_INPUT);
        const parsed = parseText(SAMPLE_INPUT);
        setQuizList(parsed);
        setFilter("전체");
        showToast("예시 문제가 입력창에 불러와졌습니다.");
      };

      const handleCopy = (text, label) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast(`[${label}] 복사되었습니다!`);
        } catch (err) {
          showToast("복사에 실패했습니다.");
        }
        document.body.removeChild(textArea);
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2200);
      };

      const availableTypes = ["전체", ...new Set(quizList.map(q => q.type))];
      const filteredData = quizList.filter(q => filter === "전체" ? true : q.type === filter);

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 font-sans p-4 md:p-8 pb-28">
          
          {/* 상단 헤더 및 입력 카드 */}
          <header className="max-w-4xl mx-auto mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-indigo-600 text-white rounded-xl shadow-md">
                  <IconListTodo size={26} />
                </div>
                <div>
                  <h1 className="text-2xl font-black text-slate-900 tracking-tight">
                    퀴즈 은행 스마트 복사 툴
                  </h1>
                  <p className="text-xs text-slate-500 font-medium">
                    구글 폼, 온라인 시험지에 각 항목(문제, 보기, 개별 빈칸 정답)별로 1-클릭 복사
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={handleLoadSample}
                  className="px-3.5 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-bold rounded-xl text-xs transition-all flex items-center gap-1.5 cursor-pointer"
                >
                  <IconSparkles size={15} />
                  예시 불러오기
                </button>
                {inputText && (
                  <button
                    onClick={handleClear}
                    className="px-3 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold rounded-xl text-xs transition-all flex items-center gap-1.5 cursor-pointer"
                  >
                    <IconTrash2 size={15} />
                    지우기
                  </button>
                )}
              </div>
            </div>

            {/* 입력창 영역 */}
            <div className="space-y-3">
              <div className="relative">
                <textarea 
                  className="w-full h-48 p-4 text-sm text-slate-800 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-mono leading-relaxed"
                  placeholder={`여기에 퀴즈 줄글 텍스트를 붙여넣으세요.\n\n[지원 형식 예시]\nQ1. [객관식] 문제 내용...\n① 보기1  ② 보기2\n[정답] ①\n[해설] 해설 내용...\n\nQ2. [선긋기] 다음 인터넷 검색 사이트와 그 구분을 바르게 연결하시오.\n(가) 국내 검색 사이트 - (A) 구글\n(나) 국외 검색 사이트 - (B) 네이버\n[정답] (가)-(B), (나)-(A)\n\nQ3. [드래그 앤 드롭] 인터넷 검색이란 §빈칸§를 통해 자신의 목적에 맞는 자료를... §빈칸§라고 부른다.\n[보기] (A) 검색 사이트  (B) 데이터 관리\n[정답] 빈칸1: 검색 사이트, 빈칸2: 데이터 관리`}
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                />
              </div>

              <button 
                onClick={handleConvert}
                className="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 px-6 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer"
              >
                <IconSparkles size={18} />
                <span>문항 인식 & 개별 복사 블록 생성하기 {quizList.length > 0 && `(${quizList.length}문항 감지)`}</span>
              </button>
            </div>

            {/* 도움말 안내 판 */}
            <div className="mt-4 p-3.5 bg-indigo-50/70 border border-indigo-200 rounded-xl flex items-start gap-2.5 text-xs text-indigo-950">
              <IconHelpCircle size={17} className="text-indigo-600 shrink-0 mt-0.5" />
              <div className="space-y-1">
                <p><strong>주요 정제 기능:</strong></p>
                <p>• <strong>선긋기 정제:</strong> <code className="bg-indigo-100 px-1 py-0.5 rounded font-bold">(가) 국내 검색 사이트 -</code> 처럼 끝에 있는 대시(-)와 공백을 깔끔하게 제거해줍니다.</p>
                <p>• <strong>드래그 앤 드롭 원문 유지:</strong> <code className="bg-indigo-100 px-1 py-0.5 rounded font-bold">§빈칸§</code>이 포함된 원문 텍스트만 복사할 수 있어 편리합니다.</p>
              </div>
            </div>

            {/* 필터 탭 */}
            {quizList.length > 0 && (
              <div className="mt-5 pt-4 border-t border-slate-100 flex flex-wrap items-center gap-2">
                <span className="text-xs font-bold text-slate-400 mr-2 flex items-center gap-1">
                  <IconLayers size={14} /> 문제 유형 필터:
                </span>
                {availableTypes.map(f => (
                  <button
                    key={f}
                    onClick={() => setFilter(f)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-bold transition-all cursor-pointer ${
                      filter === f 
                        ? 'bg-slate-900 text-white shadow-sm' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {f}
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* 메인 리스트 */}
          <main className="max-w-4xl mx-auto space-y-6">
            {filteredData.map((q) => (
              <article key={q.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 transition-all hover:border-slate-300">
                
                {/* 문항 헤더 */}
                <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-100 flex-wrap gap-2">
                  <div className="flex items-center gap-2.5">
                    <span className="text-lg font-black text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg">
                      Q{q.id}
                    </span>
                    <span className={`px-2.5 py-1 text-xs font-bold rounded-lg ${
                      q.type === '드래그 앤 드롭' || q.type === '드래그앤드롭' ? 'bg-amber-100 text-amber-800 border border-amber-300' :
                      q.type === '선긋기' ? 'bg-purple-100 text-purple-700' :
                      q.type === '객관식' ? 'bg-blue-100 text-blue-700' :
                      'bg-emerald-100 text-emerald-700'
                    }`}>
                      {q.type}
                    </span>
                    {q.blankCount > 0 && (
                      <span className="px-2 py-0.5 bg-amber-200/80 text-amber-900 text-[11px] font-bold rounded-md">
                        §빈칸§ {q.blankCount}개 감지
                      </span>
                    )}
                  </div>
                </div>

                {/* 개별 복사 블록들 */}
                <div className="space-y-3.5">
                  
                  {/* 문제 텍스트 복사 블록 */}
                  <CopyBlock 
                    label="문제 텍스트" 
                    text={q.question} 
                    onCopy={handleCopy} 
                  />
                  
                  {/* 보기 / 선지 / 선긋기 항목 개별 복사 */}
                  {q.options.length > 0 && (
                    <div>
                      <div className="text-xs font-bold text-slate-400 mb-1.5 ml-1">개별 보기 / 항목 (각각 클릭 복사)</div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        {q.options.map((opt, idx) => (
                          <CopyBlock 
                            key={idx} 
                            label={`항목/보기 ${idx + 1}`} 
                            text={opt} 
                            onCopy={handleCopy} 
                          />
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 드래그 앤 드롭 / 빈칸 개별 정답 복사 */}
                  {q.individualBlankAnswers.length > 0 && (
                    <div>
                      <div className="text-xs font-bold text-amber-800 mb-1.5 ml-1 flex items-center gap-1">
                        <IconArrowRight size={13} /> 개별 빈칸 정답 (각각 클릭 복사)
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        {q.individualBlankAnswers.map((item, idx) => (
                          <CopyBlock 
                            key={idx} 
                            label={item.label} 
                            text={item.value} 
                            onCopy={handleCopy} 
                            highlight={true}
                          />
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 전체 정답 및 해설 복사 */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-3 border-t border-slate-100">
                    <CopyBlock 
                      label="전체 정답" 
                      text={q.answer} 
                      onCopy={handleCopy} 
                    />
                    {q.explanation && (
                      <CopyBlock 
                        label="해설" 
                        text={q.explanation} 
                        onCopy={handleCopy} 
                      />
                    )}
                  </div>

                </div>
              </article>
            ))}

            {/* 변환된 문항이 없을 때 표시 */}
            {quizList.length === 0 && (
              <div className="text-center p-12 text-slate-400 font-medium bg-white rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <IconFileText size={40} className="mx-auto text-slate-300" />
                <p className="text-slate-600 font-bold">인식된 퀴즈 문항이 없습니다.</p>
                <p className="text-xs text-slate-400">
                  상단 텍스트 상자에 퀴즈 문항들을 붙여넣고 <strong>[문항 인식 & 개별 복사 블록 생성하기]</strong> 버튼을 누르거나,<br/>
                  <strong>[예시 불러오기]</strong> 버튼을 눌러 동작 테스트를 해보세요!
                </p>
              </div>
            )}
          </main>

          {/* Toast Notification */}
          <div 
            className={`fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 transition-all duration-300 z-50 ${
              toastMessage ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-8 scale-95 pointer-events-none'
            }`}
          >
            <IconCheckCircle size={18} className="text-emerald-400" />
            <span className="font-bold text-xs tracking-wide">{toastMessage}</span>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
